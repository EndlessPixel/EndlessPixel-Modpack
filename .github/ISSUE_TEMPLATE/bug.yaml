name: "Bug 反馈"
description: "反馈你遇到的Modpack的Bug"
labels: [· Bug, 新提交]
body:
- type: checkboxes
  id: "yml-1"
  attributes:
    label: "检查项"
    description: "请检查，确认。"
    options:
    - label: "我已在 [Issues 页面](https://github.com/EndlessPixel/EndlessPixel-Modpack/issues?q=is%3Aissue)中搜索，确认了这一 Bug 未被提交过。"
      required: true
- type: textarea
  id: "yml-2"
  attributes:
    label: 描述
    description: "详细描述该 Bug 的具体表现。"
  validations:
    required: true
- type: textarea
  id: "yml-3"
  attributes:
    label: 重现步骤
    description: "如何重现BUG。"
  validations:
    required: true
- type: textarea
  id: "yml-4"
  attributes:
    label: 附件
    placeholder: "点击这个文本框，然后再将文件直接拖拽到文本框中以上传。"
  validations:
    required: true
   
